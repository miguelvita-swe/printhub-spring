# MySQL pronto para rodar o PrintHub sem instalar nada além do Docker.
# Subir:   docker compose up -d
# Parar:   docker compose down
# Usa a porta 3307 para não conflitar com um MySQL já instalado na 3306.
# Usuário e senha são só de teste.
services:
  mysql:
    image: mysql:8.4
    container_name: printhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: printhub
      MYSQL_USER: printhub
      MYSQL_PASSWORD: printhub123
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
