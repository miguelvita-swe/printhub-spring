# Configuração usada só pelos testes automatizados (mvnw test).
# Usa o H2 em memória no modo MySQL, para os testes rodarem sem um MySQL instalado.
spring.datasource.url=jdbc:h2:mem:printhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# O import.sql está em UTF-8 (acentos).
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
