# Nome da aplicação
spring.application.name=printhub

# Conexão com o MySQL.
# Os valores podem ser trocados por variáveis de ambiente (DB_URL, DB_USUARIO, DB_SENHA)
# sem mexer neste arquivo. createDatabaseIfNotExist cria o banco "printhub" se não existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/printhub?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recria as tabelas a cada inicialização e carrega o import.sql (dados de exemplo).
# Assim toda execução começa do mesmo estado, o que facilita os testes no Postman.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Não manter a sessão do banco aberta durante a montagem da resposta JSON.
spring.jpa.open-in-view=false

server.port=8080

# O import.sql está em UTF-8 (acentos).
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
